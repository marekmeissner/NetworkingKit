name: Swift style

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint if needed
        run: command -v swiftlint || brew install swiftlint
      - name: Check lint
        run: swiftlint lint --strict --no-cache --config .swiftlint.yml

  format:
    name: Swift format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: swift format lint --strict --recursive Sources Tests
